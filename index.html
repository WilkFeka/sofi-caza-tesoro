<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Caza del tesoro</title>
  <meta name="description" content="Actividades de Ciencias Naturales para 6to grado" />
  <style>
    :root{
      --bg:#f6f7fb;
      --card:#ffffff;
      --text:#1f2937;
      --muted:#6b7280;
      --accent:#6c63ff;
      --accent-strong:#5a52ff;
      --ring: rgba(108,99,255,.35);
      --radius:16px;
      --shadow: 0 10px 25px rgba(0,0,0,.08);
    }
    *{box-sizing:border-box}
    html,body{height:100%}
    body{
      margin:0; 
      font-family: system-ui, -apple-system, Segoe UI, Roboto, Ubuntu, Cantarell, Noto Sans, Helvetica, Arial, "Apple Color Emoji", "Segoe UI Emoji";
      color:var(--text); 
      background:var(--bg); 
      line-height:1.55;
      display:flex;
      flex-direction:column;
    }
    .wrapper{max-width:980px; margin:0 auto; padding:24px; flex:1}
    
    header.hero{
      background: linear-gradient(rgba(35, 40, 50, 0.7), rgba(35, 40, 50, 0.7)), url('rosario.png') no-repeat center/cover;
      color:#fff; 
      padding:56px 0 48px; 
      margin:0 0 24px;
      box-shadow: inset 0 -1px 0 rgba(255,255,255,.15);
    }
    .hero .wrapper{padding:0 24px}
    .title{
      font-size:clamp(32px, 5vw, 48px); 
      margin:0 0 8px; 
      letter-spacing:.2px;
      font-weight:700;
    }
    .subtitle{
      margin:0; 
      opacity:.95; 
      font-size:clamp(16px, 2.2vw, 20px);
      font-weight:400;
    }

    /* Contenedor de botones */
    .buttons-container{
      display:grid;
      gap:20px;
      margin-top:40px;
      grid-template-columns: repeat(auto-fit, minmax(280px, 1fr));
      max-width:900px;
      margin-left:auto;
      margin-right:auto;
    }

    .btn-card{
      background:var(--card);
      border-radius:var(--radius);
      box-shadow:var(--shadow);
      padding:32px 24px;
      text-align:center;
      text-decoration:none;
      color:var(--text);
      transition: all 0.3s ease;
      border: 2px solid transparent;
      display:flex;
      flex-direction:column;
      align-items:center;
      gap:12px;
    }

    .btn-card:hover{
      transform:translateY(-4px);
      box-shadow: 0 15px 35px rgba(0,0,0,.12);
      border-color:var(--accent);
    }

    .btn-card:active{
      transform:translateY(-2px);
    }

    .btn-number{
      width:60px;
      height:60px;
      border-radius:50%;
      background:linear-gradient(135deg, var(--accent), var(--accent-strong));
      color:#fff;
      display:flex;
      align-items:center;
      justify-content:center;
      font-size:28px;
      font-weight:700;
      box-shadow:0 8px 16px rgba(108,99,255,.25);
    }

    .btn-title{
      font-size:20px;
      font-weight:600;
      margin:0;
    }

    .btn-subtitle{
      font-size:14px;
      color:var(--muted);
      margin:0;
    }

    footer{
      margin:28px 0 48px; 
      text-align:center; 
      color:var(--muted);
    }

    @media (max-width: 600px){
      .buttons-container{
        grid-template-columns: 1fr;
      }
    }
  </style>
</head>
<body>
  <header class="hero" role="banner">
    <div class="wrapper">
      <h1 class="title">Nuestra Ciudad</h1>
      <p class="subtitle">5to Grado - Actividades de Evaluación</p>
      <p class="subtitle" style="margin-top:12px">Seleccioná la actividad que querés realizar</p>
    </div>
  </header>

  <main class="wrapper">
    <div class="buttons-container">
      <a href="form1.html" class="btn-card">
        <div class="btn-number">1</div>
        <h2 class="btn-title">Grupo 1</h2>
        <p class="btn-subtitle">Monumento Nacional a la Bandera</p>
      </a>

      <a href="form2.html" class="btn-card">
        <div class="btn-number">2</div>
        <h2 class="btn-title">Grupo 2</h2>
        <p class="btn-subtitle">Basílica Catedral Rosario</p>
      </a>

      <a href="form3.html" class="btn-card">
        <div class="btn-number">3</div>
        <h2 class="btn-title">Grupo 3</h2>
        <p class="btn-subtitle">Parque España</p>
      </a>

      <a href="form4.html" class="btn-card">
        <div class="btn-number">4</div>
        <h2 class="btn-title">Grupo 4</h2>
        <p class="btn-subtitle">Teatro el Círculo</p>
      </a>
    </div>
  </main>

</body>
</html>
